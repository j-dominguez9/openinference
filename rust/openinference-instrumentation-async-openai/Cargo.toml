[package]
name = "openinference-instrumentation-async-openai"
description = "OpenInference instrumentation for async-openai."
version = "0.1.0"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true

[dependencies]
async-openai = { version = "0.42", default-features = false, features = ["middleware"] }
bytes = "1"
futures-core = "0.3"
http = "1"
openinference-instrumentation = { version = "0.1.0", path = "../openinference-instrumentation" }
openinference-semantic-conventions = { version = "0.1.0", path = "../openinference-semantic-conventions" }
opentelemetry = "0.33.1"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde_json = "1"
tower = { version = "0.5", default-features = false }

[dev-dependencies]
async-openai = { version = "0.42", default-features = false, features = ["middleware", "chat-completion", "rustls"] }
opentelemetry-otlp = { version = "0.33", features = ["reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33.0", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
